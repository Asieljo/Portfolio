    <!-- Applies the saved theme before first paint; ThemeProvider owns it afterwards.
         Keep the names in sync with THEMES in src/features/theme/ThemeProvider.jsx. -->
    <script>
      try {
        var theme = localStorage.getItem('portfolio-theme');
        if (theme === 'primary' || theme === 'secondary' || theme === 'complementary') {
          document.documentElement.dataset.theme = theme;
        }
      } catch {
        // Storage unavailable: keep the default primary theme.
      }
    </script>
